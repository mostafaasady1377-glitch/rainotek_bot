<title>انتقال راینوتک</title><body>
<h3>اتصال مرورگر کارشناس</h3>
<p>آدرس رابط انتقال را ثبت کنید؛ برای اجرای محلی http://127.0.0.1:8769 و برای سرور آدرس HTTPS. ورود دیوار فقط در مرورگر خودتان انجام می‌شود.</p>
<input id="origin" type="url" placeholder="http://127.0.0.1:8769" dir="ltr" size="35">
<button id="save">ثبت اتصال</button><p id="status" role="status"></p>
<p>پس از نصب و ثبت اتصال، لینک انتقال را از بات باز کنید. اگر دیوار نشست را منقضی کند، دوباره وارد شوید.</p>
